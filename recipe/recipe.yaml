schema_version: 1

context:
  name: rubicon-objc
  version: "0.5.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ed2a56284a18ceb6370276069e8aab685b5465bbb457a5f13e09e37d0618703d

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools ==82.0.1
    - setuptools-scm ==10.2.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - rubicon
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A bridge between an Objective C runtime environment and Python.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://beeware.org/rubicon
  repository: https://github.com/beeware/rubicon-objc

extra:
  recipe-maintainers:
    - thewchan
